default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

# production:
#   <<: *default

production:
  dispatchers:
    - polling_interval: 2
      batch_size: 200

  workers:
    # 默认队列（区块监控等）
    - queues: default
      threads: 4
      processes: 1
      polling_interval: 1

    # Tron 转账专用队列 —— 严格控制并发
    - queues: tron_transfers
      threads: 6 # 生产关键：限制为8，保护15 QPS
      processes: 1
      polling_interval: 0.4
